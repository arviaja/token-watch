name: Bug report
description: Something does not work as the README says.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you see, and what you expected to see.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start a session in a repo.
        2. Run /token-watch.
        3. Select tab 2.
    validations:
      required: true
  - type: input
    id: claude-version
    attributes:
      label: Claude Code version
      description: The output of `claude --version`.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - CLI
        - Desktop app (Code tab)
        - Both
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshot or log
      description: Remove repo names, paths and other private data first.
